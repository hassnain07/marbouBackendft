services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: marbou
      POSTGRES_PASSWORD: marbou
      POSTGRES_DB: marbou
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marbou"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  dbdata: {}
